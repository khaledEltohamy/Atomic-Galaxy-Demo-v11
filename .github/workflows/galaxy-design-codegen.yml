# GENERATED BY GALAXY
name: Galaxy Design Codegen

on:
  push:
    paths-ignore:
      - "packages/design_system/lib/**"
      - "apps/demo_app/lib/src/modules/**"
      - "apps/demo_app/lib/generated/**"
      - "apps/demo_app/lib/src/app/routes/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galaxy-design-codegen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate design system and pages
        env:
          # Optional. Create a repository secret named ANTHROPIC_API_KEY and
          # Claude will classify the few layers the rules cannot decide
          # (buttons, fields, ...). Results are cached next to tokens.json,
          # so unchanged layers are never sent again. Without the secret the
          # generator works exactly as before.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/generate_design.sh

      - name: Commit generated files
        run: |
          git config user.name "galaxy-bot"
          git config user.email "galaxy-bot@users.noreply.github.com"

          # Generation can modify:
          # - design system
          # - generated modules/pages
          # - generated routes
          # - assets
          # - assets_path.dart
          # - pubspec/lock files

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "chore: regenerate design system and pages [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
