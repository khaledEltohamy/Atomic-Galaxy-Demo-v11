name: demo_app

description: Flutter application generated by Galaxy.

publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  dartz: ^0.10.1
  get_it: ^8.0.3
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter:
    sdk: flutter

  tokens:
    path: ../../packages/tokens

  design_system:
    path: ../../packages/design_system

  # SVG icons exported from Figma.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
